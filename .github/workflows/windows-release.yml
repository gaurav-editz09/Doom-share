name: Windows desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install --upgrade -r requirements.txt pyinstaller

      - name: Create original app icon
        shell: pwsh
        run: |
          python -c "from PIL import Image; Image.open('logo.png').save('logo.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Build desktop application
        run: python -m PyInstaller --noconfirm --clean doom.spec

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Create installer and GitHub ZIP
        shell: pwsh
        run: |
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" installer\Doom.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Compress-Archive -Path dist\Doom-Setup.exe -DestinationPath dist\Doom-Windows-Setup.zip -Force

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Doom-Setup.exe
            dist/Doom-Windows-Setup.zip

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Doom-Windows-Setup
          path: dist/Doom-Windows-Setup.zip
